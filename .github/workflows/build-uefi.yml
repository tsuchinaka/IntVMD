name: build-uefi

# Compila el driver UEFI de VMD (IntelVMDUefi) con EDK2 y verifica que el
# paquete EDK2 (DSC/INF/dec + VMDCore) construye en X64. No toca hardware.
#
# Diagnostico sin token: los logs de job dan 403, asi que cada paso vuelca con
# "| tee -a ci.log" y el ultimo paso publica la cola como anotaciones del
# check-run (legibles sin autenticar).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          set -eo pipefail
          {
            echo "=== dependencias ==="
            sudo apt-get update
            sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-pip
          } 2>&1 | tee -a ci.log

      - name: Clonar EDK2
        run: |
          set -eo pipefail
          {
            echo "=== clone edk2 ==="
            git clone --depth 1 --branch edk2-stable202411 \
              https://github.com/tianocore/edk2.git edk2
            git -C edk2 submodule update --init --depth 1
          } 2>&1 | tee -a ci.log

      - name: BaseTools
        run: |
          set -eo pipefail
          {
            echo "=== basetools ==="
            pip3 install --upgrade -r edk2/pip-requirements.txt
            make -C edk2/BaseTools -j"$(nproc)"
          } 2>&1 | tee -a ci.log

      # Sin "set -u": edksetup.sh no es seguro ante variables no definidas y
      # aborta en silencio. Todo va en un solo paso para no perder la salida.
      - name: Build del driver
        run: |
          set -eo pipefail
          {
            echo "=== build driver ==="
            export WORKSPACE="$PWD"
            export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
            export PACKAGES_PATH="$PWD/edk2:$PWD"
            source edk2/edksetup.sh BaseTools
            build -p IntVMD.dsc -a X64 -t GCC5 -b RELEASE
          } 2>&1 | tee -a ci.log

      - name: Verificar artefacto
        run: |
          set -eo pipefail
          {
            echo "=== artefacto ==="
            find Build/IntVMD -name 'IntelVMDUefi.efi' -print -exec file {} \;
          } 2>&1 | tee -a ci.log

      - name: Resumen (cola del log)
        if: always()
        run: |
          {
            echo "### Cola del log (ultimas 60 lineas)"
            echo '```'
            tail -60 ci.log 2>/dev/null || echo "(sin ci.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -40 ci.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=uefi::$(echo "$line" | tr -d '\r' | cut -c1-220)"
          done
          exit 0

      - name: Upload driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMDUefi
          path: Build/IntVMD/**/IntelVMDUefi.efi
          if-no-files-found: warn
