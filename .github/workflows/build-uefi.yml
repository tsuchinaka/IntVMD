name: build-uefi

# Compila el driver UEFI de VMD (IntelVMDUefi) con EDK2 y verifica que el
# paquete EDK2 (DSC/INF/dec + VMDCore) construye en X64. No toca hardware.
#
# Diagnostico SIN token: los logs de job dan 403 y los artifacts 401. Canales
# publicos utilizables:
#   - El log completo se publica como asset del Release "ci-logs".
#   - El .efi compilado se publica como asset del Release "uefi-latest".
#   - Ademas se emiten anotaciones ::error (acotadas, pero legibles sin auth).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          set -eo pipefail
          {
            echo "=== dependencias ==="
            sudo apt-get update
            sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-pip
          } 2>&1 | tee -a ci.log

      - name: Clonar EDK2
        run: |
          set -eo pipefail
          {
            echo "=== clone edk2 ==="
            git clone --depth 1 --branch edk2-stable202411 \
              https://github.com/tianocore/edk2.git edk2
            git -C edk2 submodule update --init --depth 1
          } 2>&1 | tee -a ci.log

      - name: BaseTools
        run: |
          set -eo pipefail
          {
            echo "=== basetools ==="
            pip3 install --upgrade -r edk2/pip-requirements.txt
            make -C edk2/BaseTools -j"$(nproc)"
          } 2>&1 | tee -a ci.log

      - name: Build del driver
        run: |
          set +e
          export WORKSPACE="$PWD"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          # EDK2 resuelve un paquete como <PACKAGES_PATH>/<Nombre>/<Nombre>.dec.
          # Como el paquete ES la raiz del repo (IntVMD/IntVMD.dec), hay que
          # poner el directorio PADRE en PACKAGES_PATH: el checkout se llama
          # "IntVMD", asi que queda <padre>/IntVMD/IntVMD.dec.
          export PACKAGES_PATH="$PWD/edk2:$(dirname "$PWD")"
          {
            echo "=== build driver ==="
            source edk2/edksetup.sh BaseTools
            build -p IntVMD.dsc -a X64 -t GCC5 -b RELEASE
          } 2>&1 | tee build-driver.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > build.rc
          echo "=== build rc=$rc, $(wc -l < build-driver.log) lineas ===" | tee -a ci.log
          # Solo errores reales del compilador (excluye "-Werror" de las flags).
          grep -nE "error:|error F0|Error |undefined reference|No such file" build-driver.log \
            | head -30 | tee -a ci.log || true
          exit 0

      # El log completo como asset publico: es el unico modo fiable de leer el
      # fallo sin token (las anotaciones se recortan).
      - name: Publicar log (publico)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cp build-driver.log build-driver.log.txt 2>/dev/null
          ls -l build-driver.log.txt 2>/dev/null
          gh release delete ci-logs --yes --cleanup-tag 2>/dev/null
          gh release create ci-logs build-driver.log.txt \
            -t "CI logs" -n "build-driver.log de $GITHUB_SHA" \
            && echo "log: https://github.com/tsuchinaka/IntVMD/releases/download/ci-logs/build-driver.log.txt"

      - name: Verificar artefacto
        if: always()
        run: |
          set +e
          {
            echo "=== artefacto ==="
            find Build/IntVMD -name '*.efi' -print 2>/dev/null
            echo "=== arbol ==="
            find Build/IntVMD -maxdepth 4 -type d 2>/dev/null | sort
          } 2>&1 | tee -a ci.log

      - name: Publicar driver (publico)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          f=$(find Build/IntVMD -name 'IntelVMDUefi.efi' 2>/dev/null | head -1)
          if [ -z "$f" ]; then echo "sin .efi, no publico"; exit 0; fi
          cp "$f" IntelVMDUefi.efi
          ls -l IntelVMDUefi.efi
          gh release delete uefi-latest --yes --cleanup-tag 2>/dev/null
          gh release create uefi-latest IntelVMDUefi.efi \
            -t "IntelVMDUefi (latest)" -n "build de $GITHUB_SHA" \
            && echo "efi: https://github.com/tsuchinaka/IntVMD/releases/download/uefi-latest/IntelVMDUefi.efi"

      - name: Resumen (cola del log)
        if: always()
        run: |
          {
            echo "### Cola del log (ultimas 30 lineas)"
            echo '```'
            tail -30 ci.log 2>/dev/null || echo "(sin ci.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -25 ci.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=uefi::$(echo "$line" | tr -d '\r' | cut -c1-220)"
          done
          exit 0

      - name: Resultado del build
        if: always()
        run: |
          rc=$(cat build.rc 2>/dev/null || echo 1)
          echo "build rc=$rc"
          test "$rc" = "0"
