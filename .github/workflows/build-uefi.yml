name: build-uefi

# Compila el driver UEFI de VMD (IntelVMDUefi) con EDK2. No pone nada en un
# sistema real: solo verifica que el paquete EDK2 (DSC/INF/dec + VMDCore)
# construye en X64. La validacion en hardware es un paso aparte (OpenCore).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de EDK2
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3

      - name: Clonar EDK2
        run: |
          set -euo pipefail
          # Tag estable (no master): evita que un cambio aguas arriba rompa CI.
          git clone --depth 1 --branch edk2-stable202411 \
            https://github.com/tianocore/edk2.git edk2
          git -C edk2 submodule update --init --depth 1

      - name: Construir BaseTools
        run: |
          set -euo pipefail
          make -C edk2/BaseTools -j"$(nproc)"

      - name: Build del driver
        run: |
          set -euo pipefail
          export WORKSPACE="$PWD"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          export PACKAGES_PATH="$PWD/edk2:$PWD"
          . edk2/edksetup.sh BaseTools
          build -p IntVMD.dsc -a X64 -t GCC5 -b RELEASE 2>&1 | tee build-uefi.log

      - name: Resumir errores de compilacion
        if: always()
        run: |
          {
            echo "### Errores de compilacion (EDK2)"
            echo '```'
            grep -E "(error|Error|fatal)" build-uefi.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error|Error|fatal)" build-uefi.log | head -8 | while IFS= read -r line; do
            echo "::error title=edk2::$(echo "$line" | tr -d '\r' | cut -c1-200)"
          done
          exit 0

      - name: Verificar artefacto
        if: always()
        run: |
          set -euo pipefail
          find Build/IntVMD -name 'IntelVMDUefi.efi' -print -exec file {} \;

      - name: Upload driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMDUefi
          path: Build/IntVMD/**/IntelVMDUefi.efi
          if-no-files-found: warn
