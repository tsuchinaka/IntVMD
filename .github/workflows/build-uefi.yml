name: build-uefi

# Compila el driver UEFI de VMD (IntelVMDUefi) con EDK2 y verifica que el
# paquete EDK2 (DSC/INF/dec + VMDCore) construye en X64. No toca hardware.
#
# Nota de diagnostico: los logs de job requieren token (403). Por eso TODO se
# vuelca a ci.log y el ultimo paso publica la cola del log como anotaciones del
# check-run, que si son legibles sin autenticar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          set -euo pipefail
          exec > >(tee -a ci.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm python3 python3-pip

      - name: Clonar EDK2
        run: |
          set -euxo pipefail
          exec > >(tee -a ci.log) 2>&1
          git clone --depth 1 --branch edk2-stable202411 \
            https://github.com/tianocore/edk2.git edk2
          git -C edk2 submodule update --init --depth 1

      - name: BaseTools
        run: |
          set -euxo pipefail
          exec > >(tee -a ci.log) 2>&1
          pip3 install --upgrade -r edk2/pip-requirements.txt
          make -C edk2/BaseTools -j"$(nproc)"

      - name: Build del driver
        run: |
          set -euxo pipefail
          exec > >(tee -a ci.log) 2>&1
          export WORKSPACE="$PWD"
          export EDK_TOOLS_PATH="$PWD/edk2/BaseTools"
          export PACKAGES_PATH="$PWD/edk2:$PWD"
          . edk2/edksetup.sh BaseTools
          build -p IntVMD.dsc -a X64 -t GCC5 -b RELEASE

      - name: Verificar artefacto
        run: |
          set -euxo pipefail
          exec > >(tee -a ci.log) 2>&1
          find Build/IntVMD -name 'IntelVMDUefi.efi' -print -exec file {} \;

      - name: Resumen (cola del log)
        if: always()
        run: |
          {
            echo "### Cola del log (ultimas 40 lineas)"
            echo '```'
            tail -40 ci.log 2>/dev/null || echo "(sin ci.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -30 ci.log 2>/dev/null | while IFS= read -r line; do
            echo "::error title=uefi::$(echo "$line" | tr -d '\r' | cut -c1-220)"
          done
          exit 0

      - name: Upload driver
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMDUefi
          path: Build/IntVMD/**/IntelVMDUefi.efi
          if-no-files-found: warn
