name: build-kext

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-13 quedo EOL (deprecacion 2025-09-22, sin soporte desde 2025-12-08).
    # Un job que pide un label retirado no falla: queda encolado para siempre
    # esperando una maquina que nunca llega. Por eso los runs se veian "Queued".
    # macos-15-intel es el ultimo runner hospedado con CPU Intel (x86_64).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select SDK with kernel (KEXT) headers
        # Los SDK sin version (MacOSX.sdk) redirigen IOPCIDevice.h a
        # PCIDriverKit y rompen la compilacion de kexts. Hay que usar uno
        # versionado, p.ej. MacOSX13.sdk.
        run: |
          set -euo pipefail
          ROOT="$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs"
          for cand in MacOSX15.sdk MacOSX14.5.sdk MacOSX14.4.sdk MacOSX14.sdk MacOSX13.3.sdk MacOSX13.sdk; do
            if [ -d "$ROOT/$cand" ]; then
              echo "SDK=$ROOT/$cand" >> "$GITHUB_ENV"
              echo "Usando SDK: $cand"
              exit 0
            fi
          done
          echo "::error::No se encontro un SDK versionado en $ROOT"
          exit 1

      - name: Build
        run: make all
        env:
          SDK: ${{ env.SDK }}

      - name: Syntax check
        run: make check
        env:
          SDK: ${{ env.SDK }}

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -f IntelVMD.kext/Contents/MacOS/IntelVMD
          plutil -lint IntelVMD.kext/Contents/Info.plist
          file IntelVMD.kext/Contents/MacOS/IntelVMD
          codesign -dv IntelVMD.kext 2>&1 | head -4
          otool -hv IntelVMD.kext/Contents/MacOS/IntelVMD | head -3

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMD-kext
          path: IntelVMD.kext