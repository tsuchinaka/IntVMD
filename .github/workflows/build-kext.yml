name: build-kext

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-13 quedo EOL (deprecacion 2025-09-22, sin soporte desde 2025-12-08).
    # Un job que pide un label retirado no falla: queda encolado para siempre
    # esperando una maquina que nunca llega. Por eso los runs se veian "Queued".
    # macos-15-intel es el ultimo runner hospedado con CPU Intel (x86_64).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Select SDK with kernel (KEXT) headers
        # Los SDK sin version (MacOSX.sdk) redirigen IOPCIDevice.h a
        # PCIDriverKit y rompen la compilacion de kexts. Hay que usar uno
        # versionado, p.ej. MacOSX13.sdk.
        run: |
          set -euo pipefail
          ROOT="$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs"
          for cand in MacOSX15.sdk MacOSX14.5.sdk MacOSX14.4.sdk MacOSX14.sdk MacOSX13.3.sdk MacOSX13.sdk; do
            if [ -d "$ROOT/$cand" ]; then
              echo "SDK=$ROOT/$cand" >> "$GITHUB_ENV"
              echo "Usando SDK: $cand"
              exit 0
            fi
          done
          echo "::error::No se encontro un SDK versionado en $ROOT"
          exit 1

      - name: Build
        # pipefail es imprescindible: sin el, "make ... | tee" devuelve el
        # estado de tee (0) y un fallo de compilacion pasa por bueno.
        run: |
          set -o pipefail
          make all 2>&1 | tee build.log
        env:
          SDK: ${{ env.SDK }}

      # Los logs del job requieren permisos de admin para descargarlos por API,
        # asi que los errores se convierten en anotaciones del check-run, que si
        # son legibles sin autenticar.
      - name: Resumir errores de compilacion
        if: always()
        run: |
          {
            echo "### Errores de compilacion"
            echo '```'
            grep -E "(error|fatal error):" build.log | head -25 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "(error|fatal error):" build.log | head -8 | while IFS= read -r line; do
            echo "::error title=compilacion::$(echo "$line" | tr -d '\r' | cut -c1-200)"
          done
          exit 0

      - name: Subir log de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Syntax check
        run: make check
        env:
          SDK: ${{ env.SDK }}

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -f IntelVMD.kext/Contents/MacOS/IntelVMD
          plutil -lint IntelVMD.kext/Contents/Info.plist
          file IntelVMD.kext/Contents/MacOS/IntelVMD
          codesign -dv IntelVMD.kext 2>&1 | head -4
          otool -hv IntelVMD.kext/Contents/MacOS/IntelVMD | head -3

      - name: Upload kext
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMD-kext
          path: IntelVMD.kext

      # Los artifacts exigen token; un Release es publico y descargable sin
      # autenticar. Se empaqueta el bundle en zip para conservar permisos.
      - name: Publicar kext (publico)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -d IntelVMD.kext
          rm -f IntelVMD.kext.zip
          ditto -c -k --sequesterRsrc IntelVMD.kext IntelVMD.kext.zip
          ls -l IntelVMD.kext.zip
          gh release delete kext-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create kext-latest IntelVMD.kext.zip \
            -t "IntelVMD.kext (latest)" -n "build de $GITHUB_SHA" \
            && echo "kext: https://github.com/tsuchinaka/IntVMD/releases/download/kext-latest/IntelVMD.kext.zip"